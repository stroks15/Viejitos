name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-standalone-apk:
    name: Build standalone Viejitos APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.4
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # GitHub's hosted Android image already includes command-line tools.
      # android-actions/setup-android@v3 currently requests the retired SDK
      # package "tools", which makes sdkmanager fail before the build starts.
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail # sdkmanager closes stdin after accepting all licenses; yes may receive SIGPIPE.
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Build standalone Android APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify standalone APK contents and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/index.android.bundle'
          BUNDLE_BYTES="$(unzip -p "$APK" assets/index.android.bundle | wc -c)"
          test "$BUNDLE_BYTES" -gt 0
          echo "Embedded React Native bundle: $BUNDLE_BYTES bytes"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: viejitos-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
